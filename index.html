<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>의류 쇼핑몰</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
}

header {
    background: #111;
    color: white;
    padding: 15px;
    text-align: center;
}

.container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    padding: 20px;
}

.product {
    background: white;
    border-radius: 12px;
    padding: 10px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.product img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
}

button {
    background: black;
    color: white;
    border: none;
    padding: 8px;
    margin-top: 8px;
    cursor: pointer;
    border-radius: 6px;
}

button:hover {
    background: #333;
}

/* popup */
.popup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
}

.popup-content {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    width: 320px;
}

.cart {
    position: fixed;
    right: 10px;
    top: 80px;
    background: white;
    padding: 10px;
    border-radius: 10px;
    width: 220px;
}
</style>
</head>

<body>

<header>
    <h1>👕 의류 쇼핑몰</h1>
</header>

<div class="cart">
    <h3>🛒 장바구니</h3>
    <ul id="cart-list"></ul>
</div>

<div class="container" id="product-list"></div>

<!-- POPUP -->
<div class="popup" id="popup">
    <div class="popup-content">
        <h2>🎉 회원가입 혜택!</h2>
        <p>첫 구매 <b>10% 할인</b> 받으세요</p>
        <button onclick="join()">가입하기</button>
        <button onclick="closePopup()">괜찮아요</button>
    </div>
</div>

<script>
const products = [
{
name: "흰색 반팔 티셔츠",
img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"
},
{
name: "검정 후드티",
img: "https://images.unsplash.com/photo-1520975958225-8c8c6b7a2f6c"
},
{
name: "파란 셔츠",
img: "https://images.unsplash.com/photo-1593032465175-481ac7f401a0"
},
{
name: "남성 청바지",
img: "https://images.unsplash.com/photo-1542272604-787c3835535d"
},
{
name: "반바지",
img: "https://images.unsplash.com/photo-1506629082955-511b1aa562c8"
},
{
name: "봄버 자켓",
img: "https://images.unsplash.com/photo-1520975682031-a7a4c1c1c1c1"
},
{
name: "폴로 셔츠",
img: "https://images.unsplash.com/photo-1521334884684-d80222895322"
},
{
name: "겨울 니트",
img: "https://images.unsplash.com/photo-1602810318383-5a1c9d3f1c8f"
},
{
name: "여성 원피스",
img: "https://images.unsplash.com/photo-1520975922284-9b1a5b4c6f6d"
},
{
name: "꽃무늬 원피스",
img: "https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb"
},
{
name: "여성 청바지",
img: "https://images.unsplash.com/photo-1475178626620-a4d074967452"
},
{
name: "크롭탑",
img: "https://images.unsplash.com/photo-1520975922167-3f1a4d2c9c1b"
},
{
name: "민소매 티셔츠",
img: "https://images.unsplash.com/photo-1520975682032-1b1c1c1c1c1c"
},
{
name: "데님 자켓",
img: "https://images.unsplash.com/photo-1544022613-e87ca75a784a"
},
{
name: "조거 팬츠",
img: "https://images.unsplash.com/photo-1600180758890-6b94519a8ba6"
},
{
name: "스포츠 세트",
img: "https://images.unsplash.com/photo-1517832606299-7ae9b720a186"
}
];

let cart = [];

function renderProducts(){
    const container = document.getElementById("product-list");
    container.innerHTML = products.map((p,i)=>`
        <div class="product">
            <img src="${p.img}?auto=format&fit=crop&w=400&q=60">
            <h4>${p.name}</h4>
            <p>₩19,900</p>
            <button onclick="addCart('${p.name}')">장바구니 추가</button>
        </div>
    `).join("");
}

function addCart(name){
    cart.push(name);
    document.getElementById("cart-list").innerHTML =
    cart.map(i=>`<li>${i}</li>`).join("");
}

// popup
window.onload = function(){
    renderProducts();
    setTimeout(()=>{
        document.getElementById("popup").style.display = "flex";
    }, 1000);
};

function closePopup(){
    document.getElementById("popup").style.display = "none";
}

function join(){
    alert("10% 할인 쿠폰이 적용되었습니다 🎉");
    closePopup();
}
</script>

</body>
</html>
